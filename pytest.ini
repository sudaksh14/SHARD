[pytest]
testpaths = tests
pythonpath = .
addopts = -p no:cacheprovider
filterwarnings =
    ignore::FutureWarning
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    slow: takes more than ~30 s on CPU (full-size ViT-B models)
    checkpoint: needs the released checkpoint (set SHARD_CHECKPOINT)
    gpu: needs a CUDA GPU
    jetson: needs a physical Jetson board
